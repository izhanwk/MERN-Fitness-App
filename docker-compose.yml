services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: "${MONGODB_URI:?Set MONGODB_URI in .env to your MongoDB Atlas connection string}"
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-fittrack}
      SECRET_KEY: ${SECRET_KEY:-dev_access_secret_change_me}
      REFRESH: ${REFRESH:-dev_refresh_secret_change_me}
      JWT_VERIFY: ${JWT_VERIFY:-dev_verify_secret_change_me}
      SERVER_BASE_URL: ${DOCKER_SERVER_BASE_URL:-http://localhost:5000}
      ALLOWED_ORIGINS: ${DOCKER_ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dev_key}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-hello@example.com}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-FitTrack App}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${DOCKER_VITE_API_URL:-http://localhost:5000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
